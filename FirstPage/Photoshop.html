<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>David Brolin - Photoshop</title>
    <link rel="stylesheet" href="main.css">
</head>
<body data-page="photoshop">
    <div class="wrapper">
        <header id="legacy-nav"></header>

        <main class="innehall single-column">
            <section class="text centered">
                <h1>Photoshop</h1>
                <img class="psIcon" src="Photoshop.png" alt="Photoshop ikon" loading="lazy" decoding="async">
                <p>Här är ett urval av äldre grafiskt arbete.</p>
            </section>

            <section class="gallery" aria-label="Photoshop galleri">
                <figure class="media-card">
                    <img class="psbilder" src="kids.jpg" alt="Grafiskt arbete med barnmotiv" loading="lazy" decoding="async">
                </figure>
            </section>
        </main>

        <footer class="footer" id="legacy-footer"></footer>
    </div>
    <script src="legacy-shell.js" defer></script>
</body>
</html>
