<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" role="img" aria-label="Current CV preview card">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101018"/>
      <stop offset="100%" stop-color="#281424"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f4f6ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#d9deff" stop-opacity="0.4"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="1600" fill="url(#bg)"/>
  <rect x="70" y="70" width="1060" height="1460" rx="34" ry="34" fill="none" stroke="#f4f6ff" stroke-opacity="0.18" stroke-width="4"/>
  <text x="120" y="250" fill="#f3f5ff" font-size="72" font-family="Manrope, Arial, sans-serif" font-weight="700">David Brolin</text>
  <text x="120" y="320" fill="#d9deff" font-size="38" font-family="Manrope, Arial, sans-serif">Current CV</text>
  <rect x="120" y="380" width="960" height="6" fill="url(#line)"/>
  <text x="120" y="500" fill="#edf0ff" fill-opacity="0.9" font-size="34" font-family="Manrope, Arial, sans-serif">Open the latest version in Canva</text>
  <text x="120" y="560" fill="#edf0ff" fill-opacity="0.7" font-size="30" font-family="Manrope, Arial, sans-serif">This card always points to the updated CV link.</text>
  <rect x="120" y="670" width="430" height="98" rx="49" ry="49" fill="#f4f6ff" fill-opacity="0.92"/>
  <text x="182" y="733" fill="#0e0f14" font-size="34" font-family="Manrope, Arial, sans-serif" font-weight="700">View Latest CV</text>
</svg>
