<!DOCTYPE html>
<html lang="sv">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>David Brolin - Hobby</title>
	<link rel="stylesheet" href="main.css">
</head>
<body data-page="hobby">
	<div class="wrapper">
		<header id="legacy-nav"></header>

		<main class="innehall single-column">
			<section class="text centered">
				<img class="rocket-icon" src="rocket.png" alt="Rocket League ikon" loading="lazy" decoding="async">
				<h1>Rocket League</h1>
				<p>Rocket League är ett bil-fotbollsspel utvecklat av Psyonix. Jag gillar både tävlingsdelen och friheten att vara kreativ med rörelser, skott och teamwork.</p>
				<p>För mig är det en bra mix av precision, tempo och stil. Det gör att spelet känns kul även efter många timmar.</p>
			</section>

			<section class="gallery two-col" aria-label="Rocket League bilder och länk">
				<figure class="media-card">
					<img src="octane.png" alt="Rocket League bilmodell Octane" loading="lazy" decoding="async">
				</figure>
				<a class="media-card video-link" href="https://www.youtube.com/watch?v=ncNwe13rguE&t=1s" target="_blank" rel="noopener noreferrer">
					<img class="ball" src="rocket-league-ball.png" alt="Rocket League boll, öppnar gameplay-video" loading="lazy" decoding="async">
				</a>
			</section>
		</main>

		<footer class="footer" id="legacy-footer"></footer>
	</div>
	<script src="legacy-shell.js" defer></script>
</body>
</html>
